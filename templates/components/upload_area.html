<section id="upload-section" class="max-w-2xl mx-auto print:hidden">
    <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
        <form id="upload-form" class="flex flex-col md:flex-row gap-4 items-center">
            <input type="file" id="file-input" name="files" multiple 
                   class="flex-1 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
            <button type="submit" id="btn-processar" 
                    class="bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black hover:bg-emerald-700 transition-all disabled:opacity-50 shadow-lg shadow-emerald-200">
                Analisar Documentos
            </button>
        </form>
        <div id="loader" class="hidden mt-6 text-center py-4">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-600 mx-auto"></div>
            <p class="mt-4 text-slate-500 font-bold italic">Processando metadados e indicadores...</p>
        </div>
    </div>
</section>
